name: Verify FutureRobotic AI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved via official GitHub API
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm api:build && pnpm api:test
      - run: pnpm test:ui && pnpm runner:test
      - run: pnpm api:test:native
      - run: pnpm web:build
      - run: pnpm infra:build && INFRA_SYNTH_ONLY=true pnpm infra:synth && pnpm infra:test
      - run: pnpm audit --prod --audit-level high
      - run: docker build --tag futurerobotic-api:ci --file portable/Dockerfile.api .
      - run: docker build --tag futurerobotic-web:ci --file portable/Dockerfile.web .
      - name: Compose smoke
        run: |
          export LOCAL_DB_PASSWORD=$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('base64url'))")
          docker compose -f portable/compose.yml up --detach --wait
          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/api/status
      - if: always()
        run: LOCAL_DB_PASSWORD=cleanup-only docker compose -f portable/compose.yml down --volumes

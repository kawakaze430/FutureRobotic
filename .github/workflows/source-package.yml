name: Cumulative source package
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-package:
    name: Source ZIP and SHA-256 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify complete source and create cumulative ZIP
        run: |
          python3 scripts/package-cumulative.py --repo . --out work/source-package
          printf '### Exact source commit\n\n%s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat work/source-package/*.zip.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Retain complete source and checksums
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: full-cumulative-source-${{ github.sha }}
          path: work/source-package/
          if-no-files-found: error
          retention-days: 30

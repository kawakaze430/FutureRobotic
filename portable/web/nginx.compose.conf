upstream api {server api:3001;}
server {
 listen 8080;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 access_log off;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /health {access_log off;proxy_pass http://api/health;}
 location = /ready {access_log off;proxy_pass http://api/ready;}
 location ~ ^/(v1|auth|api|webhooks)/ {proxy_pass http://api;proxy_set_header Host $host;proxy_set_header X-Forwarded-Proto $scheme;proxy_buffering off;proxy_read_timeout 90s;client_max_body_size 3m;}
 location / {try_files $uri $uri/ /index.html;}
}

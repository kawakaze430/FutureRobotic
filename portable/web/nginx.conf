log_format private_metadata '$request_id $request_method $status $body_bytes_sent $request_time';
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 access_log /dev/stdout private_metadata;
 server_tokens off;
 add_header X-Content-Type-Options nosniff always;
 add_header Cache-Control "no-store" always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
 location = /health {access_log off;return 200 'ok';add_header Content-Type text/plain;}
 location /assets/ {add_header Cache-Control "public, max-age=31536000, immutable";try_files $uri =404;}
 location /fonts/ {add_header Cache-Control "public, max-age=86400";try_files $uri =404;}
 location / {try_files $uri $uri/ /index.html;}
}
